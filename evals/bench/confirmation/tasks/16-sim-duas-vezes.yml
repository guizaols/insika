# REPEATED CONSENT · the customer says yes, and — as customers do — says it again
# before the reply lands. Two "sim" are one purchase.
#
# What it measures: whether an answered proposal can be spent twice. The second
# yes must find nothing left to confirm, and must not start a second checkout.
id: 16-sim-duas-vezes
agent: loja
turns:
  - user: "quero o Creme Corporal Antiatrito Vento e o Sabonete Diadia Frutas Vermelhas"
    tools_called: [add_to_cart]
  - user: "isso mesmo, pode fechar o pedido"
  - user: "sim, pode fechar"
  - user: "sim, pode fechar"
expect:
  must_not:
    - tool_error
    - phantom_action
  claims:
    add_to_cart: '\b(?:adicion(?:ei|ad[oa]s?)|coloquei|acrescentei)\b'
    remove_from_cart: '\b(?:remov(?:i|id[oa]s?)|tirei|retirei|troquei|substitu(?:í|íd[oa]s?))\b'
    create_order: '\b(?:fechei|finalizei|criei o pedido|pedido (?:criado|gerado|fechado|finalizado))\b'
store_state:
  records:
    orders:
      - total: 84.80
        items:
          - { product_id: "49599f78-7ba8-58ba-b9d8-3dfdfa7cfd1e", qty: 1 }
          - { product_id: "a03ad0d9-b083-57cd-98a4-4d718e6b2fdd", qty: 1 }
  # ONE new order beside the fixture's — a second yes that bought again shows up
  # here as a third order, and the cart handed over rather than left behind.
  count: { orders: 2, cart_items: 0 }
