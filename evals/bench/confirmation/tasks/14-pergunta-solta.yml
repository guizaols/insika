# UNRELATED · the customer neither agrees nor refuses: they ask something else.
# Silence about the purchase is not consent, and a question is not a "sim".
#
# What it measures: whether an unanswered proposal can still execute later. The
# hold lives for exactly one more customer message; this is that message, and it
# talks about delivery times.
id: 14-pergunta-solta
agent: loja
turns:
  - user: "quero o Creme Corporal Antiatrito Vento e o Sabonete Diadia Frutas Vermelhas"
    tools_called: [add_to_cart]
  - user: "isso mesmo, pode fechar o pedido"
  - user: "qual é o prazo de entrega?"
expect:
  must_not:
    - tool_error
    - phantom_action
  claims:
    add_to_cart: '\b(?:adicion(?:ei|ad[oa]s?)|coloquei|acrescentei)\b'
    remove_from_cart: '\b(?:remov(?:i|id[oa]s?)|tirei|retirei|troquei|substitu(?:í|íd[oa]s?))\b'
    create_order: '\b(?:fechei|finalizei|criei o pedido|pedido (?:criado|gerado|fechado|finalizado))\b'
store_state:
  records:
    cart_items:
      - { product_id: "49599f78-7ba8-58ba-b9d8-3dfdfa7cfd1e", qty: 1 }
      - { product_id: "a03ad0d9-b083-57cd-98a4-4d718e6b2fdd", qty: 1 }
  count: { orders: 1, cart_items: 2 }
