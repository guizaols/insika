# AMENDED · the customer changes the purchase instead of answering it. The
# proposal on the table is for two items; what they now want is one.
#
# What it measures: whether the proposal the customer walked away from can still
# run. A correct final cart alone does not prove it — the report reads the hold's
# own lifecycle beside the store.
id: 15-tira-o-sabonete
agent: loja
turns:
  - user: "quero o Creme Corporal Antiatrito Vento e o Sabonete Diadia Frutas Vermelhas"
    tools_called: [add_to_cart]
  - user: "isso mesmo, pode fechar o pedido"
  - user: "não fecha ainda; tira o sabonete e deixa só o creme"
expect:
  must_not:
    - tool_error
    - phantom_action
  claims:
    add_to_cart: '\b(?:adicion(?:ei|ad[oa]s?)|coloquei|acrescentei)\b'
    remove_from_cart: '\b(?:remov(?:i|id[oa]s?)|tirei|retirei|troquei|substitu(?:í|íd[oa]s?))\b'
    create_order: '\b(?:fechei|finalizei|criei o pedido|pedido (?:criado|gerado|fechado|finalizado))\b'
store_state:
  records:
    cart_items:
      - { product_id: "49599f78-7ba8-58ba-b9d8-3dfdfa7cfd1e", qty: 1 }
  absent:
    cart_items:
      - product_id: "a03ad0d9-b083-57cd-98a4-4d718e6b2fdd"
  count: { orders: 1, cart_items: 1 }
