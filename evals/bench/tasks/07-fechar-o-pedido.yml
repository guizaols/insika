# MEDIUM · the artifact the whole bench exists to grade: two items, then "fecha".
# Creme Corporal Antiatrito Vento (R$ 49,90) + Sabonete Diadia Frutas Vermelhas
# (R$ 34,90) = R$ 84,80, arithmetic the store does and the reply must not contradict.
#
# What it measures: does an order actually exist when the conversation says one does.
# A confident "pedido confirmado!" over a store where nothing happened is the single
# most expensive failure in this whole table, and it is invisible to every grader
# that only reads text.
id: 07-fechar-o-pedido
agent: loja
turns:
  - user: "quero o Creme Corporal Antiatrito Vento e o Sabonete Diadia Frutas Vermelhas"
  - user: "isso mesmo, pode fechar o pedido"
expect:
  # The call graders read the LAST turn only, so this names what closing looks like;
  # that the two items were added at all is proven by the order below, which is the
  # stronger statement anyway.
  tools_called:
    - create_order
  must_not:
    - tool_error
store_state:
  records:
    orders:
      - total: 84.80
        items:
          - { product_id: "49599f78-7ba8-58ba-b9d8-3dfdfa7cfd1e", qty: 1 }
          - { product_id: "a03ad0d9-b083-57cd-98a4-4d718e6b2fdd", qty: 1 }
  # One new order beside the fixture's, and the cart handed over to it rather than
  # left behind as a second copy of the same purchase.
  count: { orders: 2, cart_items: 0 }
