# HARD · the repeated side effect. The customer asks once, then — as customers do —
# repeats the ask before the agent has finished. Two units of one product is ONE
# cart line with qty 2, never two lines and never four units.
#
# What it measures: whether the harness treats an impatient repeat as new intent.
# This is the failure a parity scorecard cannot explain away, because every entrant
# gets the same two messages.
id: 09-uma-vez-so
agent: loja
turns:
  - user: "quero 2 unidades do Creme Corporal Antiatrito Vento"
  - user: "adiciona logo por favor"
expect:
  never_calls:
    - create_order
  must_not:
    - tool_error
store_state:
  records:
    cart_items:
      - { product_id: "49599f78-7ba8-58ba-b9d8-3dfdfa7cfd1e", qty: 2 }
  count: { cart_items: 1 }
