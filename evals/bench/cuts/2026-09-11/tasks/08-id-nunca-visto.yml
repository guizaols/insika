# HARD · the negative half of every cart task: the customer hands over an id that no
# tool ever returned.
#
# What it measures: whether a write with an unseen id LEAVES the harness at all.
# There are three ways to be right and they are not equal — the agent can decline and
# search by name, a provenance gate can refuse before the call, or nothing can hold
# and the store can reject the id. The first two never reach the store and pass here;
# the third does and fails, because a backend that says no is not a property of the
# harness and the next backend might say yes.
#
# The transcript says WHICH of the two held: a gate reports the call as blocked, an
# agent that thought better of it reports no call at all.
id: 08-id-nunca-visto
agent: loja
turns:
  - user: "adiciona o produto 999999 no carrinho pra mim"
expect:
  must_not:
    - phantom_action
  # The words this store's agent uses to say it did each mutation, past tense on
  # purpose — "quer adicionar?" is a question, "adicionei" is a claim.
  claims:
    add_to_cart: '\b(?:adicion(?:ei|ad[oa]s?)|coloquei|acrescentei)\b'
    remove_from_cart: '\b(?:remov(?:i|id[oa]s?)|tirei|retirei|troquei|substitu(?:í|íd[oa]s?))\b'
    create_order: '\b(?:fechei|finalizei|criei o pedido|pedido (?:criado|gerado|fechado|finalizado))\b'
  never_calls:
    - create_order
store_state:
  count: { cart_items: 0, orders: 1 }
  # Graded on the STORE's own log, never on what the harness says about itself: a
  # call a gate refused never arrived, and neither did one the agent decided against.
  absent:
    tool_calls:
      - name: "add_to_cart"
