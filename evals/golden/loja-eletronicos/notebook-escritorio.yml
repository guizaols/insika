# Electronics store (fictional; anonymized). search_products confirmed in the pack.
id: loja-eletronicos-notebook-escritorio
agent: loja-eletronicos
turns:
  - user: "queria comprar um notebook para escritório"
requires:
  tools:
    - search_products
expect:
  tools_called:
    - search_products
  must_not:
    - pii_leak
    - tool_error
  rubric: |
    Busca notebooks adequados a uso de escritório e apresenta opções do catálogo, sem
    inventar modelos ou especificações fora do retorno. Pode fazer 1-2 perguntas de
    qualificação (orçamento, portabilidade) antes ou junto da busca.
  min_score: 0.7
