# pos_venda.tracking — 585 conversas, a 2ª intenção. Abertura real: "Comprei e meu
# pedido não chegou", sem número de pedido nem e-mail. O backend responde
# EMAIL_REQUIRED (ver a descrição de search_orders) e o agente tem que PEDIR, não
# adivinhar um status.
id: ocean-drop-tracking-sem-identificacao
agent: agent-store-ocean-drop
turns:
  - user: "comprei e meu pedido não chegou"
# Uma loja sem rastreio de pedido não FALHA aqui — o caso não tinha o que testar.
requires:
  tools:
    - search_orders
expect:
  tools_called:
    - search_orders
  must_not:
    - pii_leak
    - tool_error
  rubric: |
    Consulta o pedido pela tool e, como não há identificação, PEDE o e-mail (ou o
    número do pedido) para localizar. NÃO inventa status, código de rastreio, prazo
    nem transportadora, e não afirma que o pedido "está em trânsito" sem ter recebido
    isso da tool. Tom acolhedor: a pessoa está reclamando de algo que não chegou.
  min_score: 0.7
