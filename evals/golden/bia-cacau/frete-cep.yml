# Sample golden (RFC-0008). Curated from the real corpus — a customer asking for
# shipping to a CEP. Tool names must match the agent's provisioned pack; refine
# these against the actual bia-cacau tools when the runner (slice 2) provisions it.
id: cacau-frete-cep
agent: bia-cacau
turns:
  - user: "qual o frete pro 01310-100?"
expect:
  # `?` marks OPTIONAL (informational; never fails the case).
  tools_called:
    - shipping_quote
    - search_products?
  must_not:
    - pii_leak      # no CPF/CNPJ/credential in a customer-facing reply
    - tool_error    # no failed tool call in the turn
  # Consumed by the LLM-judge in Fase B (deferred in Fase A — reads as "pending").
  rubric: |
    Deve cotar o frete para São Paulo capital sem inventar prazo de entrega e sem
    prometer desconto não confirmado. Tom cordial e objetivo.
  min_score: 0.7
