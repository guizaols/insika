<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Drop — the Insika web widget</title>
    <style>
      :root {
        /* The widget's whole theming API: set these and they win. */
        --insika-accent: #0f766e;
        --insika-on-accent: #ffffff;
        --insika-bg: #ffffff;
        --insika-fg: #111827;
        --insika-muted: #f0fdfa;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111827;
        background: #f8fafc;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
      p { color: #4b5563; }
      code { background: #e2e8f0; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ocean Drop</h1>
      <p>
        A pretend shop. The only thing that matters on this page is the one
        <code>&lt;script&gt;</code> tag at the bottom of the source — there is no
        backend here, no build step and no npm.
      </p>
      <p>Click the bubble in the corner.</p>
    </main>

    <!-- This is the entire integration. -->
    <script
      src="http://127.0.0.1:9494/channels/web/asset/widget.js"
      data-agent="support"
      data-title="Ask Ocean Drop"
      data-placeholder="Where is my order?"
      data-greeting="Hi! Ask me anything about your order."
      defer
    ></script>
  </body>
</html>
